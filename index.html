<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网站建设中 · 孟宪锋个人主页</title>
<meta name="robots" content="noindex,nofollow">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;
    background:#f8f6f1;color:#1c2430;
  }
  .card{
    max-width:560px;margin:24px;padding:56px 48px;text-align:center;
    background:#fff;border:1px solid #ded7c8;border-radius:10px;
    box-shadow:0 1px 2px rgba(20,40,63,.05),0 12px 36px -14px rgba(20,40,63,.16);
  }
  .mark{
    width:56px;height:56px;margin:0 auto 24px;border-radius:10px;
    background:linear-gradient(135deg,#14283f 0%,#1d3a5f 55%,#2d6a9f 100%);
    position:relative;overflow:hidden;
  }
  .mark::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:14px;
    background:repeating-linear-gradient(-45deg,transparent 0 8px,rgba(255,255,255,.16) 8px 16px);
  }
  h1{font-size:22px;letter-spacing:4px;color:#1d3a5f;margin-bottom:14px;}
  .en{font-family:Georgia,serif;font-size:11px;letter-spacing:2.5px;color:#8a93a3;text-transform:uppercase;margin-bottom:30px;}
  p{font-size:15px;line-height:2;color:#4a5666;}
  .tip{
    margin-top:30px;padding:14px 18px;font-size:13px;line-height:1.9;
    background:#f8f6f1;border:1px dashed #d4b06a;border-radius:6px;color:#7a6a45;
  }
  .domain{margin-top:26px;font-family:Georgia,serif;font-size:13px;color:#8a93a3;letter-spacing:1px;}
</style>
</head>
<body>
  <div class="card">
    <div class="mark"></div>
    <h1>网站建设中</h1>
    <div class="en">Website Under Construction</div>
    <p>本网站正在进行 ICP 备案审核，<br>将于审核通过后正式开放。</p>
    <div class="tip">备案编号：审核通过后公示于页脚<br>预计恢复时间：2～3 周内</div>
    <div class="domain">mengxf.cn</div>
  </div>
</body>
</html>
